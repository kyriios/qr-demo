<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="QR Demo"><meta name="theme-color" content="#000000"><link rel="apple-touch-icon" href="./apple-touch-icon.png?v=11"><link rel="manifest" href="./manifest.webmanifest?v=11"><title>QR Demo</title><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}body{min-height:100dvh;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}.stage img{display:none;width:100vw;height:100dvh;object-fit:contain;background:#000;pointer-events:none}.trigger{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}.trigger input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.hint{text-align:center;padding:28px;font-size:20px;line-height:1.35}.hint small{display:block;margin-top:10px;color:#aaa;font-size:14px}</style></head><body><div class="stage"><img id="photo" alt="Image de démonstration"><div id="emptyHint" class="hint">Touchez pour charger une image<small>L'image restera enregistrée sur cet iPhone</small></div></div><div id="trigger" class="trigger"><input id="picker" type="file" accept="image/*"></div><script>const photo=document.getElementById('photo'),emptyHint=document.getElementById('emptyHint'),picker=document.getElementById('picker'),trigger=document.getElementById('trigger');let taps=0,lastTap=0;function show(src){const has=!!src;photo.style.display=has?'block':'none';emptyHint.style.display=has?'none':'block';if(has)photo.src=src}let stored=null;try{stored=localStorage.getItem('qrDemoImage')}catch(e){}show(stored);trigger.addEventListener('click',()=>{if(!photo.src||photo.style.display==='none'){picker.click();return}const now=Date.now();if(now-lastTap>900)taps=0;lastTap=now;taps++;if(taps>=3){taps=0;picker.click()}});picker.addEventListener('change',()=>{const f=picker.files&&picker.files[0];if(!f||!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=()=>{try{localStorage.setItem('qrDemoImage',r.result);show(r.result)}catch(e){alert("Image trop volumineuse. Choisissez une image plus petite ou une capture d’écran.")}picker.value=''};r.readAsDataURL(f)});if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=11'));</script></body></html>
